[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19,<2",
    "fastapi>=0.141.1",
    "fpdf2>=2.8,<3",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10,<3",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22,<1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint.isort]
known-first-party = ["app"]
